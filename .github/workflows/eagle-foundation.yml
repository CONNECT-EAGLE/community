name: eagle-foundation
on:
  pull_request:
    paths:
      - 'connect-eagle-foundation/**'
      - '.github/workflows/eagle-foundation.yml'
  push:
    branches: [main, 'feat/connect-eagle-*']
    paths:
      - 'connect-eagle-foundation/**'
      - '.github/workflows/eagle-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: CLI / ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e "connect-eagle-foundation/connect-eagle-cli[dev]"
      - run: python -m ruff check connect-eagle-foundation/connect-eagle-cli/src connect-eagle-foundation/connect-eagle-cli/tests
      - run: python -m pytest connect-eagle-foundation/connect-eagle-cli/tests
      - run: python connect-eagle-foundation/scripts/check_templates.py
      - run: python connect-eagle-foundation/project-registry/validate_registry.py connect-eagle-foundation/project-registry/projects --output catalog.json
      - run: python -m build connect-eagle-foundation/connect-eagle-cli
