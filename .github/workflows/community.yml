name: community-directory
on:
  pull_request:
    paths: ['*.md', '.github/**', 'connect-eagle-foundation/scripts/**', 'connect-eagle-foundation/project-registry/**']
  push:
    branches: [main]
    paths: ['*.md', '.github/**', 'connect-eagle-foundation/scripts/**', 'connect-eagle-foundation/project-registry/**']
permissions:
  contents: read
jobs:
  directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r connect-eagle-foundation/project-registry/requirements.txt
      - run: python connect-eagle-foundation/scripts/test_directory.py
      - run: python connect-eagle-foundation/scripts/build_directory.py --check
